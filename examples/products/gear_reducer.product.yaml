# A worked product: a two-stage spur reducer that is checked as a machine. Its drive
# train derives every shaft's speed and torque from one declared input, so no mesh and
# no shaft is screened on a torque somebody typed.
#   anvilate check examples/products/gear_reducer.product.yaml
anvilate_product: 1.17.0
name: gear-reducer
description: 'A two-stage spur reducer: three shafts, four gears, and the drive train that ties them together,
  so every shaft''s speed and torque is derived from one declared input'
definitions:
- id: base
  identity:
    description: reducer base plate
    source: make
  placeholder:
    envelope:
    - magnitude: 460
      unit: mm
    - magnitude: 200
      unit: mm
    - magnitude: 12
      unit: mm
    mass:
      magnitude: 5.4
      unit: kg
    reason: base to be detailed once the housing is drawn
- id: shaft_blank
  identity:
    description: plain shaft blank, 30 mm
    source: make
  placeholder:
    envelope:
    - magnitude: 40
      unit: mm
    - magnitude: 40
      unit: mm
    - magnitude: 140
      unit: mm
    mass:
      magnitude: 1.1
      unit: kg
    reason: shaft to be detailed once the gears are chosen
- id: pinion
  identity:
    description: spur pinion, 18 teeth, module 3
    source: buy
  placeholder:
    envelope:
    - magnitude: 54
      unit: mm
    - magnitude: 54
      unit: mm
    - magnitude: 20
      unit: mm
    mass:
      magnitude: 0.5
      unit: kg
    reason: pinion bought as a stock gear, not yet chosen
- id: wheel
  identity:
    description: spur wheel, 36 teeth, module 3
    source: buy
  placeholder:
    envelope:
    - magnitude: 108
      unit: mm
    - magnitude: 108
      unit: mm
    - magnitude: 20
      unit: mm
    mass:
      magnitude: 1.8
      unit: kg
    reason: wheel bought as a stock gear, not yet chosen
- id: shaft
  identity:
    description: output shaft
    source: make
  spec:
    anvilate_spec: 1.3.0
    name: drive-shaft
    description: "A three-step shaft with a keyway, screened under 40 N\xB7m."
    units:
      value: SI
      origin: user_stated
    material:
      ref: ASTM-A36
    manufacturing:
      process: cnc_turning
    element_type: stepped_shaft
    element_params:
      name: drive-shaft
      steps:
      - diameter:
          magnitude: 20.0
          unit: mm
        length:
          magnitude: 40.0
          unit: mm
      - diameter:
          magnitude: 30.0
          unit: mm
        length:
          magnitude: 60.0
          unit: mm
      - diameter:
          magnitude: 25.0
          unit: mm
        length:
          magnitude: 30.0
          unit: mm
      keyways:
      - step: 1
        width:
          magnitude: 6.0
          unit: mm
        depth:
          magnitude: 3.5
          unit: mm
        length:
          magnitude: 25.0
          unit: mm
        offset:
          magnitude: 5.0
          unit: mm
      end_chamfer:
        magnitude: 1.0
        unit: mm
      torque:
        magnitude: 40.0
        unit: N*m
      shoulder_stress_concentration: 1.6
      allowable_shear:
        magnitude: 145.0
        unit: MPa
      bending_moment:
        magnitude: 30.0
        unit: N*m
      shoulder_bending_stress_concentration: 1.9
      allowable_bending:
        magnitude: 250.0
        unit: MPa
    acceptance:
      tiers:
      - T1_analytical
instances:
- name: base
  item: base
- name: input
  item: shaft_blank
- name: p1
  item: pinion
- name: counter
  item: shaft_blank
- name: w1
  item: wheel
- name: p2
  item: pinion
- name: output
  item: shaft
- name: w2
  item: wheel
ground: base
mates:
- id: input-sit
  kind: face_to_face
  place:
    part: input
    face: bottom
  'on':
    part: base
    face: top
- id: input-left
  kind: edge_flush
  place:
    part: input
    face: left
  'on':
    part: base
    face: left
- id: input-front
  kind: edge_flush
  place:
    part: input
    face: front
  'on':
    part: base
    face: front
- id: p1-sit
  kind: face_to_face
  place:
    part: p1
    face: bottom
  'on':
    part: base
    face: top
- id: p1-beside
  kind: face_to_face
  place:
    part: p1
    face: left
  'on':
    part: input
    face: right
  offset:
    magnitude: 10
    unit: mm
- id: p1-front
  kind: edge_flush
  place:
    part: p1
    face: front
  'on':
    part: base
    face: front
- id: counter-sit
  kind: face_to_face
  place:
    part: counter
    face: bottom
  'on':
    part: base
    face: top
- id: counter-beside
  kind: face_to_face
  place:
    part: counter
    face: left
  'on':
    part: p1
    face: right
  offset:
    magnitude: 10
    unit: mm
- id: counter-front
  kind: edge_flush
  place:
    part: counter
    face: front
  'on':
    part: base
    face: front
- id: w1-sit
  kind: face_to_face
  place:
    part: w1
    face: bottom
  'on':
    part: base
    face: top
- id: w1-beside
  kind: face_to_face
  place:
    part: w1
    face: left
  'on':
    part: counter
    face: right
  offset:
    magnitude: 10
    unit: mm
- id: w1-front
  kind: edge_flush
  place:
    part: w1
    face: front
  'on':
    part: base
    face: front
- id: p2-sit
  kind: face_to_face
  place:
    part: p2
    face: bottom
  'on':
    part: base
    face: top
- id: p2-beside
  kind: face_to_face
  place:
    part: p2
    face: left
  'on':
    part: w1
    face: right
  offset:
    magnitude: 10
    unit: mm
- id: p2-front
  kind: edge_flush
  place:
    part: p2
    face: front
  'on':
    part: base
    face: front
- id: output-sit
  kind: face_to_face
  place:
    part: output
    face: bottom
  'on':
    part: base
    face: top
- id: output-beside
  kind: face_to_face
  place:
    part: output
    face: left
  'on':
    part: p2
    face: right
  offset:
    magnitude: 10
    unit: mm
- id: output-front
  kind: edge_flush
  place:
    part: output
    face: front
  'on':
    part: base
    face: front
- id: w2-sit
  kind: face_to_face
  place:
    part: w2
    face: bottom
  'on':
    part: base
    face: top
- id: w2-beside
  kind: face_to_face
  place:
    part: w2
    face: left
  'on':
    part: output
    face: right
  offset:
    magnitude: 10
    unit: mm
- id: w2-front
  kind: edge_flush
  place:
    part: w2
    face: front
  'on':
    part: base
    face: front
drive_train:
  shafts:
  - name: input
    carries:
    - p1
  - name: counter
    carries:
    - w1
    - p2
  - name: output
    carries:
    - w2
  gears:
  - item: p1
    teeth: 18
    pitch_diameter:
      magnitude: 54
      unit: mm
  - item: w1
    teeth: 36
    pitch_diameter:
      magnitude: 108
      unit: mm
  - item: p2
    teeth: 18
    pitch_diameter:
      magnitude: 54
      unit: mm
  - item: w2
    teeth: 36
    pitch_diameter:
      magnitude: 108
      unit: mm
  meshes:
  - name: first-stage
    driver: p1
    driven: w1
    efficiency: 1.0
    source: taken as lossless for this screening, so the derived torques are upper bounds
    pressure_angle:
      magnitude: 20
      unit: degree
    line_of_centers:
      magnitude: 0
      unit: degree
  - name: second-stage
    driver: p2
    driven: w2
    efficiency: 1.0
    source: taken as lossless for this screening, so the derived torques are upper bounds
    pressure_angle:
      magnitude: 20
      unit: degree
    line_of_centers:
      magnitude: 180
      unit: degree
  input:
    shaft: input
    speed:
      magnitude: 1500
      unit: rpm
    torque:
      magnitude: 10
      unit: N*m
  output:
    shaft: output
    speed_low:
      magnitude: 370
      unit: rpm
    speed_high:
      magnitude: 380
      unit: rpm
    source: the driven machine's rated speed band
