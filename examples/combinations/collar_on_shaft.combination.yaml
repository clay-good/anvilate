# A worked combination: A collar on the 30 mm step of a shaft, 60 mm from its drive end.
#   anvilate combine examples/combinations/collar_on_shaft.combination.yaml
anvilate_combination: 1.0.0
name: collar-on-shaft
description: A collar on the 30 mm step of a shaft, 60 mm from its drive end.
parts:
- id: shaft
  spec:
    anvilate_spec: 1.3.0
    name: shaft
    description: The shaft of a worked combination.
    units: {value: SI, origin: user_stated}
    material: {ref: ASTM-A36}
    manufacturing: {process: cnc_turning}
    element_type: stepped_shaft
    element_params:
      name: shaft
      steps:
      - diameter: {magnitude: 20.0, unit: mm}
        length: {magnitude: 40.0, unit: mm}
      - diameter: {magnitude: 30.0, unit: mm}
        length: {magnitude: 60.0, unit: mm}
      - diameter: {magnitude: 25.0, unit: mm}
        length: {magnitude: 30.0, unit: mm}
      keyways:
      - step: 1
        width: {magnitude: 6.0, unit: mm}
        depth: {magnitude: 3.5, unit: mm}
        length: {magnitude: 25.0, unit: mm}
        offset: {magnitude: 5.0, unit: mm}
      end_chamfer: {magnitude: 1.0, unit: mm}
    acceptance:
      tiers: [T1_analytical]
- id: collar
  spec:
    anvilate_spec: 1.3.0
    name: collar
    description: The collar of a worked combination.
    units: {value: SI, origin: user_stated}
    material: {ref: ASTM-A36}
    manufacturing: {process: cnc_turning}
    element_type: shaft_collar
    element_params:
      name: collar
      bore: {magnitude: 30.0, unit: mm}
      outer_diameter: {magnitude: 50.0, unit: mm}
      width: {magnitude: 12.0, unit: mm}
    acceptance:
      tiers: [T1_analytical]
mates:
- id: seated
  kind: shaft_in_bore
  fit: H7/g6
  place: {part: collar, axis: z}
  'on': {part: shaft, axis: z}
- id: located
  kind: edge_flush
  offset: {magnitude: -60.0, unit: mm}
  place: {part: collar, face: bottom}
  'on': {part: shaft, face: bottom}
