[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anvilate"
version = "0.0.1"
description = "Local-first analytical screening for mechanical, structural and industrial engineers: a physics-validated scorecard where every check cites its code."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Clay Good" }]
keywords = [
    "mechanical-engineering",
    "structural-engineering",
    "engineering-analysis",
    "cad",
    "cae",
    "dxf",
    "units",
    "tolerance-analysis",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

# Keep the analytical screening core lightweight. Audited B-Rep/STEP generation and DXF
# export are working optional capabilities, installed only when a caller needs them.
dependencies = [
    "pint>=0.24",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Deterministic B-Rep generation and STEP output. Keep this minor line pinned because the
# generated topology and file writer are product behavior, not an interchangeable helper.
geometry = [
    "build123d<0.12,>=0.11.1",
    "cadquery-ocp-novtk<8,>=7.9",
]
# DXF drawing export (ezdxf is MIT, pure-Python). The core stays dependency-light;
# import anvilate.export.dxf only pulls ezdxf when this extra is installed.
export = ["ezdxf>=1.1"]
# IFC export of structural parts (IfcOpenShell, LGPL-3.0-or-later: the same license class
# as the OCCT bindings the geometry extra already imports, loaded in-process and never
# modified). The minor line is pinned: the file it writes is product behavior.
ifc = ["ifcopenshell<0.10,>=0.9"]
# Reading PDF requirement sheets (MIT). Text only: a scanned page is reported, never guessed at.
pdf = ["pdfminer.six>=20231228"]
# `jsonschema` is a dev dependency and not a runtime one: it validates the published
# JSON Schema artifacts against the 2020-12 meta-schema in CI, which is a check about
# what Anvilate emits rather than something anvilate needs to run.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ezdxf>=1.1",
    "pdfminer.six>=20231228",
    # The 3MF Consortium's reference implementation (BSD-2-Clause), used only by the tests to
    # read back every 3MF file the exporter writes. The package never imports it.
    "lib3mf>=2.4",
    "jsonschema>=4.21",
    # The independent referee for `anvilate.frame` (MIT, Copyright 2018 D. Craig Brinck).
    # Every verification case in tests/test_frame.py is also solved by Pynite and the two
    # have to agree; the package never imports it, and the closed-form cases run without it.
    "PyNiteFEA>=3.2",
    # The CAE deck writer's keyword-format referee (MIT), used only by the tests to read
    # back every .inp it writes. Its bulk-data referee, pyNastran, pins NumPy below 2,
    # which build123d here cannot share; it runs in CI's optional-adapters job instead.
    "meshio>=5.3",
    # The IFC writer's tests write, validate and re-read every mapped element with it.
    "ifcopenshell<0.10,>=0.9",
    "mypy>=1.11",
    "build123d<0.12,>=0.11.1",
    "cadquery-ocp-novtk<8,>=7.9",
]

[project.scripts]
# The MCP server on stdio. No arguments and no configuration: the surface is the
# published tool catalog and there is no state to lose across a restart.
anvilate-mcp = "anvilate.mcp:main"
# The headless CLI. Thirteen of its thirteen commands are backed. `build` produces STEP for audited
# geometry patterns and refuses an element whose pattern has not shipped rather than passing
# it to arbitrary generated code.
anvilate = "anvilate.cli:main"

[project.urls]
Homepage = "https://github.com/clay-good/anvilate"
Documentation = "https://github.com/clay-good/anvilate/tree/main/docs"
Source = "https://github.com/clay-good/anvilate"
Issues = "https://github.com/clay-good/anvilate/issues"
Specification = "https://github.com/clay-good/anvilate/tree/main/openspec"

[tool.hatch.build.targets.wheel]
packages = ["src/anvilate"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A warning is a check nobody reads. Pydantic and pint both announce a removal one minor
# version before they make it, and a suite that prints those and goes green finds out on the
# upgrade instead. Errors here, with no ignores: the day one is needed it should be written
# down with the reason, not left as a standing exemption nobody revisits.
filterwarnings = ["error"]
