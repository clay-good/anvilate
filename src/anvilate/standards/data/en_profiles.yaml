# European hot-rolled I and H profiles (schema: standards-data).
#
# IPE and HEA sections by their EN 10365 designation. Each row records the five
# dimensions that fix the profile: depth h, flange width b, web thickness t_w, flange
# thickness t_f and root radius r, in mm. Section properties are not tabulated here;
# `anvilate.standards.profiles` computes them from these dimensions, fillets included.
#
# The values are dimensions of a published standard, recorded as facts. EN 10365 itself
# is not redistributed. They were read from two public tabulations and each row was
# checked against those tabulations' own area and second moments: the formulas in
# `CrossSection.rolled_i_section` reproduce every published A and I_y to within 0.5%
# (IPE to 0.08%; the HEA tabulation rounds A to three figures). The check is kept as a
# test, so a mistyped dimension fails it.
dataset:
  name: anvilate-en-profiles
  version: "0.1.0"
  source: "EN 10365:2017 hot-rolled I and H section dimensions, as tabulated by eurocodeapplied.com (IPE) and prontubeam.com (HEA)"
  license: "CC0-1.0 (dimension values only; EN 10365 not redistributed)"
  retrieved: "2026-09-19"

# designation: [h, b, t_w, t_f, r] in mm.
