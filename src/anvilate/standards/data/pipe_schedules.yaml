# Welded and seamless wrought steel pipe dimensions (schema: standards-data).
#
# ASME B36.10M dimensions: the outside diameter a nominal pipe size (NPS) actually
# has, and the wall thickness each schedule carries. Both are facts a design
# retrieves, never recalls — an NPS 4 pipe is 114.3 mm outside diameter and nothing
# about the number 4 says so, and the schedule-to-wall mapping is not a formula.
#
# STD and XS are carried as their own schedules rather than aliased to 40 and 80.
# They coincide only up to a point — STD tracks Schedule 40 through NPS 10 and then
# holds at 9.53 mm while Schedule 40 keeps thickening, and XS tracks Schedule 80
# through NPS 8 and then holds at 12.70 mm. Treating them as synonyms is right for
# small bore and wrong for large, which is exactly the shape of error a screen
# should not be able to make.
#
# The source standard is not redistributed, only the dimension table.
dataset:
  name: anvilate-pipe-schedules-seed
  version: "0.1.0"
  source: "ASME B36.10M welded and seamless wrought steel pipe dimensions"
  license: "CC0-1.0 (dimension values only; source standard not redistributed)"
  retrieved: "2026-08-17"

# Outside diameter in mm, per NPS. Constant across every schedule for a given NPS —
# that is the point of the schedule system: the wall grows inward and the pipe still
# fits the same fittings.
outside_diameter:
  "1/2": 21.3
  "3/4": 26.7
  "1": 33.4
  "1-1/4": 42.2
  "1-1/2": 48.3
