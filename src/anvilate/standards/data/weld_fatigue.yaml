# Welded-joint fatigue test points (schema: standards-data).
#
# Two constant-amplitude S-N campaigns from "A Dataset of Fatigue Properties for Welded
# Joints" (Deng, Luo, Gong, Liu, Zhang and Wang, figshare, 2025, version 2), which compiles
# test results from the published literature under CC BY 4.0. Each campaign is one
# `dataset_id` in that release, copied point for point from its S-N.json (md5
# 55a9defc400f717147702d6c8a91f0ce) with the test conditions from its parameter.json (md5
# c6e93be560fefd4653514a24751eb3c5). Every point is a failed specimen: neither campaign
# records a run-out. Stress is the nominal range, max minus min, in MPa.
#
# A campaign is bundled only where the release states everything `SpecimenMetadata`
# requires, numerically where it is a number: the test temperature, the environment, the
# stress ratio and the thickness. A temperature recorded as "ambient" was not read as 20 C,
# and a campaign sharing its metadata with a sibling series from the same paper was left
# out, since nothing would say which series it is.
#
# The points are data. The curve a record carries is fitted from them by
# `anvilate.standards.weld_fatigue` and is a mean curve, valid over the tested range only.
dataset:
  name: anvilate-weld-fatigue
  version: "0.1.0"
  source: "A Dataset of Fatigue Properties for Welded Joints (Deng et al., figshare, 2025, v2)"
  license: "CC-BY-4.0 (credit the dataset's authors and each campaign's original publication)"
  retrieved: "2026-10-08"
  doi: "10.6084/m9.figshare.29254265.v2"
  authors: "Caiyan Deng, Chenyu Luo, Baoming Gong, Yong Liu, Xu Zhang, Shuaikun Wang"

campaigns:
  SM50B-CRUCIFORM-R0:
    dataset_id: 1868
    publication: "Fatigue Strength Improvement by Replacing Welded Joints with Ductile Cast Iron Joints, Tetsu-to-Hagane (2019), doi:10.2355/tetsutohagane.TETSU-2018-158"
    material: "SM50B steel"
    joint: "cruciform joint, failing at the weld toe"
    loading_mode: axial
    stress_ratio: 0.0
    temperature: {magnitude: 23.0, unit: degC}
    environment: "air"
