name: "Anvilate check"
description: >-
  Screen every Design Spec in a repository and fail the run on any check that failed or
  could not be evaluated.
author: "Anvilate"

inputs:
  path:
    description: >-
      The file or directory to screen. A directory is searched recursively; a document
      found by searching that carries no `anvilate_spec` key is skipped with a line on
      stderr, while a file named here is taken at its word and is an error if it is not a
      spec.
    required: false
    default: "."
  python-version:
    description: "The Python to install Anvilate under."
    required: false
    default: "3.11"
  ref:
    description: >-
      The Anvilate revision to install — a branch, tag, or commit of the repository. Pin it
      to a tag for a build you want to stay reproducible; the default tracks main, which is
      the right choice while the project is pre-alpha and the wrong one afterwards.
    required: false
    default: "main"
  allow-not-evaluated:
    description: >-
      Accept exit code 2 — a card that could not be fully evaluated — as a pass. Off by
      default, and deliberately: a screen that could not run is not a screen that passed,
      and a merge gate that treats the two alike is the silent green this whole tool
      exists to avoid. Turn it on only while a known gap is being closed.
    required: false
    default: "false"
  report:
    description: "Where to write the JSON scorecard report, or empty to write none."
    required: false
    default: ""
  bundles:
    description: >-
      Where to write the JSON evidence bundles, or empty to write none.
      `headless-automation` asks CI to publish evidence bundles as outputs, and the
      bundle roll-up is never better than its worst section — so this is the artifact a
      reviewer reads when the run fails, not a nicety.
    required: false
    default: ""
  sarif:
    description: >-
      Where to write the SARIF 2.1.0 log, or empty to write none. Every failing,
      not-evaluated and warning check becomes an annotation on the line of the spec field
      it is about. Uploading it is the caller's step: this action writes the file and says
      how many results it holds, because an upload needs permissions a composite action
      should not assume.
    required: false
    default: ""
  sarif-category:
    description: >-
      The code-scanning category to upload the SARIF under. One category per spec set, so
      two runs over two folders do not overwrite each other's findings.
    required: false
    default: "anvilate"
  junit:
    description: "Where to write the JUnit XML report, or empty to write none."
    required: false
    default: ""
  baseline:
    description: >-
      A committed baseline of card digests to compare against. The run reports what
      changed and fails on news — a newly failing spec, a newly not-evaluated one, or one
      the baseline records and the sweep did not find. Never written here: the baseline is
      updated by `anvilate check --write-baseline` and committed.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Anvilate
      shell: bash
      env:
        ANVILATE_REF: ${{ inputs.ref }}
      # Not `pip install anvilate`. There is no `anvilate` on PyPI — the index answers 404
      # for it today — so the one line every user of this action runs first would have
      # failed for every one of them. Until a release is published, the honest install is
      # the repository this action ships in, and `ref` is how a caller pins it. Swap this
      # for the distribution the day it exists; the scheduled `pypi-availability` job in
      # `ci.yml` is what will say so, and it fails either way round.
      run: pip install "anvilate @ git+https://github.com/clay-good/anvilate@${ANVILATE_REF}"
    - name: Screen every spec
      shell: bash
      env:
        ANVILATE_PATH: ${{ inputs.path }}
        ANVILATE_ALLOW_NOT_EVALUATED: ${{ inputs.allow-not-evaluated }}
        ANVILATE_REPORT: ${{ inputs.report }}
        ANVILATE_BUNDLES: ${{ inputs.bundles }}
        ANVILATE_SARIF: ${{ inputs.sarif }}
        ANVILATE_SARIF_CATEGORY: ${{ inputs.sarif-category }}
        ANVILATE_JUNIT: ${{ inputs.junit }}
        ANVILATE_BASELINE: ${{ inputs.baseline }}
      run: |
        set -uo pipefail
        if [ -n "$ANVILATE_REPORT" ]; then
          anvilate check "$ANVILATE_PATH" --format json > "$ANVILATE_REPORT"
        fi
        if [ -n "$ANVILATE_BUNDLES" ]; then
          anvilate export "$ANVILATE_PATH" --format json > "$ANVILATE_BUNDLES"
        fi
        # The reports and the baseline comparison ride on the one run whose exit code is
        # the gate. Writing them in a separate invocation would screen the repository
        # twice and could report a different answer from the one the gate acted on.
        reports=()
        [ -n "$ANVILATE_SARIF" ] \
          && reports+=(--sarif "$ANVILATE_SARIF" --sarif-category "$ANVILATE_SARIF_CATEGORY")
        [ -n "$ANVILATE_JUNIT" ] && reports+=(--junit "$ANVILATE_JUNIT")
        [ -n "$ANVILATE_BASELINE" ] && reports+=(--baseline "$ANVILATE_BASELINE")
        [ -n "$ANVILATE_BASELINE" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ] \
          && reports+=(--summary "$GITHUB_STEP_SUMMARY")
        anvilate check "$ANVILATE_PATH" "${reports[@]+"${reports[@]}"}"
        status=$?
        if [ -n "$ANVILATE_SARIF" ] && [ -f "$ANVILATE_SARIF" ]; then
          # GitHub code scanning takes at most 5,000 results per upload. Saying the count
          # here is what lets a caller see a repository approaching it, rather than
          # discovering the truncation in a dashboard that quietly stopped reporting.
          results=$(python -c "import json,sys;d=json.load(open(sys.argv[1]));print(sum(len(r.get('results',[])) for r in d['runs']))" "$ANVILATE_SARIF")
          echo "::notice::anvilate wrote $results SARIF results to $ANVILATE_SARIF"
          if [ "$results" -gt 5000 ]; then
            echo "::warning::$results results exceed the 5,000 GitHub accepts in one upload; split the run by folder and upload each under its own category"
          fi
        fi
        # The exit codes are the interface:
        #   0 passed
        #   1 a check failed
        #   2 a card could not be evaluated
        #   3 the request was wrong
        #   4 the operation is unbuilt
        #   6 a check met its limit inside a declared caution band
        # Only 2 is ever forgiven, and only when the caller asked for it in as many words.
        if [ "$status" -eq 2 ] && [ "$ANVILATE_ALLOW_NOT_EVALUATED" = "true" ]; then
          echo "::warning::a card could not be fully evaluated; allow-not-evaluated is on"
          exit 0
        fi
        exit "$status"
