name: Publish MCP registry metadata

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  # add-interaction-quality 6.1 and onboarding's time-to-first-part: measured on the
  # reference profile (this runner class, Python 3.11) for every release, recorded on the
  # release itself, and a sustained breach of tools/responsiveness/budget.json stops the
  # registry publication below.
  responsiveness:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ".[geometry,export]"
      - name: Interactive operations against their budget
        run: python tools/responsiveness/measure.py --out responsiveness.json
      - name: Fresh install to a first validated part
        run: python tools/responsiveness/measure.py --first-part --out first-part.json
      - name: Record the measurement on the release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" responsiveness.json first-part.json --clobber

  publish:
    needs: responsiveness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v\d+\.\d+\.\d+", tag) is None:
              raise SystemExit(f"release tag must be vX.Y.Z, got {tag!r}")
          version = tag[1:]

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          server = json.loads(pathlib.Path("server.json").read_text())
          package = server["packages"][0]
          versions = {
              "pyproject.toml": project["project"]["version"],
              "server.json": server["version"],
              "server.json package": package["version"],
          }
          mismatches = {name: value for name, value in versions.items() if value != version}
          if mismatches:
              raise SystemExit(f"release {version} does not match {mismatches}")

          expected_from = f"anvilate=={version}"
          from_values = [
              arg.get("value")
              for arg in package["runtimeArguments"]
              if arg.get("name") == "--from"
          ]
          if from_values != [expected_from]:
              raise SystemExit(f"runtime --from must be {expected_from!r}")

          marker = f'<!-- mcp-name: {server["name"]} -->'
          if marker not in pathlib.Path("README.md").read_text():
              raise SystemExit(f"README.md is missing {marker}")

          pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a").write(f"version={version}\n")
          PY

      - name: Wait for the exact PyPI release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/anvilate/{version}/json"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      if response.status == 200:
                          break
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              if attempt == 29:
                  raise SystemExit(f"anvilate {version} is not available from PyPI")
              time.sleep(10)
          PY

      - name: Download the pinned MCP publisher
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" mcp-publisher

      - name: Validate registry metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate with the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish registry metadata
        run: ./mcp-publisher publish server.json
